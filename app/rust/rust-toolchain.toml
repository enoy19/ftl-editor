[toolchain]
# native_toolchain_rust requires an exact channel version for reproducible builds.
# Desktop targets only: the app ships for macOS, Windows and Linux.
channel = "1.99.0"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
