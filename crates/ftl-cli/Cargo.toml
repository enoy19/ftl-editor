[package]
name = "ftled"
description = "ftled: command line for reading and editing FTL saved games."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["command-line-utilities", "game-development"]
# Only the sources ship; tests and fixtures stay in the repository.
include = ["src/**/*", "Cargo.toml"]

[[bin]]
name = "ftled"
path = "src/main.rs"

[dependencies]
ftl-app.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
jiff.workspace = true
